name: Deploy to Vercel

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  VERCEL_PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=$VERCEL_ENVIRONMENT --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }} ($VERCEL_ENVIRONMENT)" >> "$GITHUB_STEP_SUMMARY"
